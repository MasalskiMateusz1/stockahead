spring.application.name=stockahead

spring.jpa.hibernate.ddl-auto=validate

spring.messages.encoding=UTF-8

app.setup-token=${STOCKAHEAD_SETUP_TOKEN:local-only-setup-token}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# The parts CSV import enforces its own 1 MB limit in PartImportController, so it
# can answer with a message; these container limits only stop runaway uploads.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Content-hashed static resource URLs (@{/css/app.css} -> /css/app-<hash>.css) so a
# deploy never serves a stale stylesheet or script from the browser cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
# Hashed URLs change on every content change, so browsers may cache them long-term.
spring.web.resources.cache.cachecontrol.max-age=365d
