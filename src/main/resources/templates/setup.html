<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pierwsze uruchomienie')}">
	<meta charset="UTF-8">
	<title>Pierwsze uruchomienie — Stockahead</title>
</head>
<body>
	<main class="auth-page">
		<div class="card">
			<h1>Załóż konto kierownika</h1>

			<div th:replace="~{fragments :: alerts}"></div>

			<form th:action="@{/setup}" method="post">
				<div class="form-field">
					<label for="companyName">Nazwa firmy</label>
					<input type="text" id="companyName" name="companyName" th:value="${companyName}" maxlength="255" required>
				</div>
				<div class="form-field">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" th:value="${email}" required>
				</div>
				<div class="form-field">
					<label for="password">Hasło</label>
					<input type="password" id="password" name="password" required>
				</div>
				<div class="form-field">
					<label for="confirmPassword">Potwierdź hasło</label>
					<input type="password" id="confirmPassword" name="confirmPassword" required>
				</div>
				<div class="form-field">
					<label for="token">Token konfiguracyjny</label>
					<input type="text" id="token" name="token" required>
				</div>
				<button type="submit" class="btn">Załóż konto</button>
			</form>
		</div>
	</main>
</body>
</html>
