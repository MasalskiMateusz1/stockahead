<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Zmień nazwę projektu — Stockahead</title>
</head>
<body>
	<h1>Zmień nazwę projektu</h1>

	<p th:if="${error}" th:text="${error}"></p>

	<form th:action="@{/projects/{id}(id=${id})}" method="post">
		<div>
			<label for="name">Nazwa</label>
			<input type="text" id="name" name="name" th:value="${name}" required>
		</div>
		<button type="submit">Zapisz zmiany</button>
	</form>

	<p><a th:href="@{/projects/{id}(id=${id})}">Powrót do projektu</a></p>
</body>
</html>
