<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nowy projekt')}">
	<meta charset="UTF-8">
	<title>Nowy projekt — Stockahead</title>
</head>
<body data-section="projects">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<div class="page-header">
			<h1>Nowy projekt</h1>
		</div>

		<div th:replace="~{fragments :: alerts}"></div>

		<form class="card" th:action="@{/projects}" method="post">
			<div class="form-field">
				<label for="name">Nazwa</label>
				<input type="text" id="name" name="name" th:value="${name}" required>
			</div>
			<div class="form-actions">
				<button type="submit" class="btn">Dodaj projekt</button>
				<a class="btn btn-secondary" th:href="@{/projects}">Anuluj</a>
			</div>
		</form>
	</main>
</body>
</html>
