<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Kartoteka części')}">
	<meta charset="UTF-8">
	<title>Kartoteka części — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Kartoteka części</h1>

		<p th:if="${deliveryReceived}" class="alert alert-success" role="status" th:text="${deliveryReceived}"></p>

		<p th:if="${stockCorrected}" class="alert alert-success" role="status" th:text="${stockCorrected}"></p>

		<p th:if="${partsImported}" class="alert alert-success" role="status" th:text="${partsImported}"></p>

		<div class="page-actions">
			<a class="btn" th:href="@{/deliveries/new}">Przyjmij dostawę</a>
			<a sec:authorize="hasRole('MANAGER')" class="btn btn-secondary" th:href="@{/parts/new}">Dodaj część</a>
			<a sec:authorize="hasRole('MANAGER')" class="btn btn-secondary" th:href="@{/parts/import}">Importuj części z CSV</a>
		</div>

		<form class="form-inline" th:action="@{/parts}" method="get">
			<div class="form-field">
				<label for="q">Szukaj</label>
				<input type="text" id="q" name="q" th:value="${q}">
			</div>
			<div sec:authorize="hasRole('MANAGER')">
				<label for="showInactive">
					<input type="checkbox" id="showInactive" name="showInactive" value="true" th:checked="${showInactive}">
					pokaż nieaktywne
				</label>
			</div>
			<button type="submit" class="btn">Szukaj</button>
		</form>

		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>Nazwa</th>
						<th>Stan</th>
						<th>Zarezerwowane</th>
						<th>Dostępne</th>
						<th>Lokalizacje</th>
						<th sec:authorize="hasRole('MANAGER')">Akcje</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="row : ${parts}">
						<td th:text="${row.part.name}"></td>
						<td th:text="${row.part.quantity}"></td>
						<td th:text="${row.reserved}"></td>
						<td th:text="${row.available}"></td>
						<td th:text="${#strings.listJoin(row.part.locations.![location], ', ')}"></td>
						<td sec:authorize="hasRole('MANAGER')">
							<div class="actions">
								<a class="btn btn-secondary" th:href="@{/parts/{id}/edit(id=${row.part.id})}">Edytuj</a>
								<a class="btn btn-secondary" th:href="@{/parts/{id}/correction(id=${row.part.id})}">Koryguj stan</a>
								<form th:if="${row.part.active}" th:action="@{/parts/{id}/deactivate(id=${row.part.id})}" method="post">
									<button type="submit" class="btn btn-danger">Dezaktywuj</button>
								</form>
								<form th:unless="${row.part.active}" th:action="@{/parts/{id}/reactivate(id=${row.part.id})}" method="post">
									<button type="submit" class="btn btn-secondary">Reaktywuj</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
