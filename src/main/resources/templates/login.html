<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Logowanie')}">
	<meta charset="UTF-8">
	<title>Logowanie — Stockahead</title>
</head>
<body>
	<main class="auth-page">
		<div class="card">
			<h1>Zaloguj się</h1>

			<p th:if="${param.error}" class="alert alert-error" role="alert" th:text="#{login.error.badCredentials}"></p>
			<p th:if="${param.logout}" class="alert alert-info" role="status" th:text="#{login.status.loggedOut}"></p>
			<p th:if="${param.setup}" class="alert alert-success" role="status" th:text="#{login.status.operatorCreated}"></p>
			<p th:if="${param.deactivated}" class="alert alert-error" role="alert" th:text="#{login.status.deactivated}"></p>
			<p th:if="${param.roleChanged}" class="alert alert-error" role="alert" th:text="#{login.status.roleChanged}"></p>
			<p th:if="${param.registered}" class="alert alert-success" role="status" th:text="#{login.status.registered}"></p>

			<form th:action="@{/login}" method="post">
				<div class="form-field">
					<label for="username">E-mail</label>
					<input type="email" id="username" name="username" required>
				</div>
				<div class="form-field">
					<label for="password">Hasło</label>
					<input type="password" id="password" name="password" required>
				</div>
				<button type="submit" class="btn">Zaloguj</button>
			</form>

			<p class="hint">Nie masz konta? <a th:href="@{/register}">Zarejestruj firmę</a></p>
		</div>
	</main>
</body>
</html>
