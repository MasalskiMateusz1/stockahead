<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nowe konto')}">
	<meta charset="UTF-8">
	<title>Nowe konto — Stockahead</title>
</head>
<body data-section="accounts">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Nowe konto</h1>

		<div th:replace="~{fragments :: alerts}"></div>

		<form class="card" th:action="@{/manager/accounts}" method="post">
			<div class="form-field">
				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" th:value="${email}" maxlength="255" required>
			</div>
			<div class="form-field">
				<label for="role">Rola</label>
				<select id="role" name="role" required>
					<option value="TECHNICIAN" th:selected="${role != 'MANAGER'}">Technik</option>
					<option value="MANAGER" th:selected="${role == 'MANAGER'}">Kierownik</option>
				</select>
			</div>
			<div class="form-field">
				<label for="password">Hasło</label>
				<input type="password" id="password" name="password" minlength="12" required>
			</div>
			<div class="form-field">
				<label for="confirmPassword">Potwierdź hasło</label>
				<input type="password" id="confirmPassword" name="confirmPassword" minlength="12" required>
			</div>
			<button type="submit" class="btn">Załóż konto</button>
		</form>

		<div class="page-actions">
			<a class="btn btn-secondary" th:href="@{/manager/accounts}">Powrót do listy</a>
		</div>
	</main>
</body>
</html>
