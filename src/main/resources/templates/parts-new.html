<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nowa część')}">
	<meta charset="UTF-8">
	<title>Nowa część — Stockahead</title>
</head>
<body data-section="parts">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<div class="page-header">
			<h1>Nowa część</h1>
		</div>

		<div th:replace="~{fragments :: alerts}"></div>

		<form class="card" th:action="@{/parts}" method="post">
			<div class="form-field">
				<label for="name">Nazwa</label>
				<input type="text" id="name" name="name" th:value="${name}" required>
			</div>
			<div class="form-field">
				<label for="quantity">Stan magazynowy</label>
				<input type="number" min="0" id="quantity" name="quantity" th:value="${quantity}" required>
			</div>
			<div class="form-field">
				<label for="locations">Lokalizacje (jedna na linię)</label>
				<textarea id="locations" name="locations" rows="5" th:text="${locations}"></textarea>
			</div>
			<div class="form-actions">
				<button type="submit" class="btn">Dodaj część</button>
				<a class="btn btn-secondary" th:href="@{/parts}">Anuluj</a>
			</div>
		</form>
	</main>
</body>
</html>
