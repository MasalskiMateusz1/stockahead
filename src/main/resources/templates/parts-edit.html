<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Edytuj część — Stockahead</title>
</head>
<body>
	<h1>Edytuj część</h1>

	<p th:if="${error}" th:text="${error}"></p>

	<form th:action="@{/parts/{id}(id=${id})}" method="post">
		<div>
			<label for="name">Nazwa</label>
			<input type="text" id="name" name="name" th:value="${name}" required>
		</div>
		<div>
			<p>Stan magazynowy: <span th:text="${quantity}"></span></p>
			<p><small>Stan zmienia się przez dostawę lub korektę, nie tutaj.</small></p>
		</div>
		<div>
			<label for="locations">Lokalizacje (jedna na linię)</label>
			<textarea id="locations" name="locations" rows="5" th:text="${locations}"></textarea>
		</div>
		<button type="submit">Zapisz zmiany</button>
	</form>

	<p><a th:href="@{/parts}">Powrót do kartoteki</a></p>
</body>
</html>
