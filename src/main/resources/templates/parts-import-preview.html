<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Podgląd importu części')}">
	<meta charset="UTF-8">
	<title>Podgląd importu części — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Podgląd importu części</h1>

		<p th:if="${notice}" class="alert alert-error" role="alert" th:text="${notice}"></p>

		<p class="hint">Sprawdź stany po imporcie. Nic nie zostało jeszcze zapisane.</p>

		<div class="table-wrap">
			<table>
				<thead>
					<tr>
						<th>Część</th>
						<th>Stan przed</th>
						<th>Dodawana ilość</th>
						<th>Stan po</th>
						<th>Nowe lokalizacje</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="row : ${rows}">
						<td>
							<span th:text="${row.displayName}"></span>
							<span th:if="${row.newPart}" class="badge">NOWA</span>
							<span th:if="${row.inactive}" class="badge badge-muted">(nieaktywna)</span>
						</td>
						<td th:text="${row.quantityBefore}"></td>
						<td th:text="${row.quantityAdded}"></td>
						<td th:text="${row.quantityAfter}"></td>
						<td th:text="${#strings.listJoin(row.locationsToAdd, ', ')}"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<p class="summary">
			Nowe części: <strong th:text="${totals.newParts}"></strong>,
			aktualizowane części: <strong th:text="${totals.updatedParts}"></strong>,
			dodawane sztuki: <strong th:text="${totals.unitsAdded}"></strong>.
		</p>

		<div class="page-actions">
			<form th:action="@{/parts/import/confirm}" method="post">
				<input type="hidden" name="token" th:value="${token}">
				<button type="submit" class="btn">Zatwierdź import</button>
			</form>

			<form th:action="@{/parts/import/cancel}" method="post">
				<button type="submit" class="btn btn-secondary">Anuluj</button>
			</form>
		</div>
	</main>
</body>
</html>
