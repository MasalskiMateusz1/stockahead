<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Lista zakupów')}">
	<meta charset="UTF-8">
	<title>Lista zakupów — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Lista zakupów</h1>

		<div class="page-actions">
			<a class="btn" th:href="@{/purchasing/export}">Eksportuj do CSV</a>
		</div>

		<p th:if="${#lists.isEmpty(rows)}" class="empty">Brak braków.</p>

		<div class="table-wrap" th:unless="${#lists.isEmpty(rows)}">
			<table>
				<thead>
					<tr>
						<th>Część</th>
						<th>Brakująca ilość</th>
						<th>Zablokowane zlecenia</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="row : ${rows}">
						<td>
							<span th:text="${row.partName}"></span>
							<span th:if="${!row.partActive}" class="badge badge-muted">(nieaktywna)</span>
						</td>
						<td th:text="${row.missingQuantity}"></td>
						<td>
							<th:block th:each="blocked, iter : ${row.blockedOrders}">
								<a th:href="@{/orders/{id}(id=${blocked.orderId})}"
									th:text="${blocked.projectName} + ' (' + ${blocked.requiredDate} + ', ' + ${blocked.missingQuantity} + ')'"></a>
								<span th:unless="${iter.last}">; </span>
							</th:block>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
