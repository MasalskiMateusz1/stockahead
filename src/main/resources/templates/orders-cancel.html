<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${'Anulowanie zlecenia ' + projectName})}">
	<meta charset="UTF-8">
	<title>Anulowanie zlecenia — Stockahead</title>
</head>
<body data-section="orders">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<div class="page-header">
			<h1 th:text="'Anulowanie zlecenia: ' + ${projectName}"></h1>
		</div>

		<div th:replace="~{fragments :: alerts}"></div>

		<form th:if="${cancellable}" th:action="@{/orders/{id}/cancel(id=${orderId})}" method="post">
			<p th:if="${#lists.isEmpty(lines)}" class="empty">Z tego zlecenia nie pobrano żadnych części.</p>

			<div class="card confirm-summary" th:unless="${#lists.isEmpty(lines)}">
				<p>Podaj, ile pobranych sztuk wraca na magazyn. Pozostałe zostaną uznane za zużyte.</p>
				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th>Część</th>
								<th>Lokalizacje</th>
								<th>Pobrana ilość</th>
								<th>Ilość do zwrotu</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="line : ${lines}">
								<td th:text="${line.partName}"></td>
								<td th:text="${line.locations}"></td>
								<td th:text="${line.pickedQuantity}"></td>
								<td>
									<input type="hidden" th:name="'seenPicked_' + ${line.lineId}" th:value="${line.pickedQuantity}">
									<input type="number" min="0" size="6"
										th:id="'returned-' + ${line.lineId}"
										th:name="'returned_' + ${line.lineId}"
										th:value="${line.returnValue}">
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div class="confirm-actions">
				<button type="submit" class="btn btn-danger">Potwierdź anulowanie</button>
				<a class="btn btn-secondary" th:href="@{/orders/{id}(id=${orderId})}">Wróć</a>
			</div>
		</form>

		<div class="confirm-actions" th:unless="${cancellable}">
			<a class="btn btn-secondary" th:href="@{/orders/{id}(id=${orderId})}">Wróć</a>
		</div>
	</main>
</body>
</html>
