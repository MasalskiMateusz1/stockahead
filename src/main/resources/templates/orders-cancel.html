<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="'Anulowanie zlecenia ' + ${projectName} + ' — Stockahead'">Anulowanie zlecenia — Stockahead</title>
	<style>
		td, th {
			text-align: center;
		}
	</style>
</head>
<body>
	<p th:if="${error}" th:text="${error}"></p>

	<h1 th:text="'Anulowanie zlecenia: ' + ${projectName}"></h1>

	<form th:if="${cancellable}" th:action="@{/orders/{id}/cancel(id=${orderId})}" method="post">
		<p th:if="${#lists.isEmpty(lines)}">Z tego zlecenia nie pobrano żadnych części.</p>

		<div th:unless="${#lists.isEmpty(lines)}">
			<p>Podaj, ile pobranych sztuk wraca na magazyn. Pozostałe zostaną uznane za zużyte.</p>
			<table>
				<thead>
					<tr>
						<th>Część</th>
						<th>Lokalizacje</th>
						<th>Pobrana ilość</th>
						<th>Ilość do zwrotu</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="line : ${lines}">
						<td th:text="${line.partName}"></td>
						<td th:text="${line.locations}"></td>
						<td th:text="${line.pickedQuantity}"></td>
						<td>
							<input type="hidden" th:name="'seenPicked_' + ${line.lineId}" th:value="${line.pickedQuantity}">
							<input type="text" size="6"
								th:id="'returned-' + ${line.lineId}"
								th:name="'returned_' + ${line.lineId}"
								th:value="${line.returnValue}">
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<button type="submit">Potwierdź anulowanie</button>
	</form>

	<p><a th:href="@{/orders/{id}(id=${orderId})}">Powrót do zlecenia</a></p>
</body>
</html>
