<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${order.projectName})}">
	<meta charset="UTF-8">
	<title>Kompletacja — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1 th:text="${order.projectName}"></h1>

		<div th:replace="~{fragments :: alerts}"></div>

		<dl class="stats">
			<dt>Liczba sztuk:</dt>
			<dd th:text="${order.quantityUnits}"></dd>
			<dt>Priorytet:</dt>
			<dd><span class="badge" th:classappend="|badge-${order.priority.name().toLowerCase()}|" th:text="#{orders.priority.__${order.priority.name().toLowerCase()}__}"></span></dd>
			<dt>Wymagany termin:</dt>
			<dd th:text="${order.requiredDate}"></dd>
		</dl>
		<p th:if="${order.taken}"><span class="badge badge-muted">Zlecenie podjęte</span></p>
		<p th:if="${order.completionReported}"><span class="badge badge-info"
			th:text="'Zgłoszone do potwierdzenia' + (${order.builtUnits != null} ? ' — zbudowano ' + ${order.builtUnits} + ' z ' + ${order.quantityUnits} : '')">Zgłoszone do potwierdzenia</span></p>
		<form class="card form-inline" th:if="${order.canReportCompletion}" th:action="@{/picking/{orderId}/report-completion(orderId=${orderId})}" method="post">
			<div class="form-field">
				<label for="builtUnits">Zbudowano sztuk</label>
				<input type="number" id="builtUnits" name="builtUnits" min="0" th:max="${order.quantityUnits}" required
					th:value="${builtUnits != null} ? ${builtUnits} : ${order.quantityUnits}">
			</div>
			<button type="submit" class="btn">Zgłoś zakończenie</button>
		</form>

		<h2>Pozycje do skompletowania</h2>

		<p th:if="${#lists.isEmpty(lines)}" class="empty">Brak pozycji.</p>

		<div class="table-wrap" th:unless="${#lists.isEmpty(lines)}">
			<table>
				<thead>
					<tr>
						<th>Część</th>
						<th>Lokalizacje</th>
						<th>Wymagana ilość</th>
						<th>Zarezerwowana ilość</th>
						<th>Pobrana ilość</th>
						<th>Do pobrania</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="line : ${lines}">
						<td th:text="${line.partName}"></td>
						<td th:text="${line.locations}"></td>
						<td th:text="${line.requiredQuantity}"></td>
						<td th:text="${line.reservedQuantity}"></td>
						<td th:text="${line.pickedQuantity}"></td>
						<td th:text="${line.remainingToPick}"></td>
						<td th:if="${line.remainingToPick > 0 and order.status.name() == 'OPEN' and !order.completionReported}">
							<div class="actions">
								<form th:action="@{/picking/{orderId}/lines/{lineId}/pick(orderId=${orderId},lineId=${line.lineId})}" method="post">
									<input type="text" size="6"
										th:id="'quantity-' + ${line.lineId}"
										name="quantity"
										th:value="${errorLineId != null and errorLineId == line.lineId} ? ${quantity} : ${line.remainingToPick}">
									<button type="submit" class="btn">Pobierz</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="page-actions">
			<a class="btn btn-secondary" th:href="@{/picking}">Powrót do listy kompletacyjnej</a>
		</div>
	</main>
</body>
</html>
