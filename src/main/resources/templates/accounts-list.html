<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Konta')}">
	<meta charset="UTF-8">
	<title>Konta — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Konta</h1>

		<div th:replace="~{fragments :: alerts}"></div>

		<div class="page-actions">
			<a class="btn" th:href="@{/manager/accounts/new}">Załóż konto</a>
		</div>

		<div class="table-wrap">
			<table>
				<thead>
					<tr><th>E-mail</th><th>Rola</th><th>Status</th><th>Akcja</th></tr>
				</thead>
				<tbody>
					<tr th:each="account : ${accounts}">
						<td th:text="${account.email}"></td>
						<td th:text="${account.role.name() == 'MANAGER'} ? 'Kierownik' : 'Technik'"></td>
						<td><span class="badge" th:classappend="${account.active} ? '' : 'badge-muted'" th:text="${account.active} ? 'Aktywny' : 'Nieaktywny'"></span></td>
						<td>
							<div class="actions">
								<form th:if="${account.active}" th:action="@{/manager/accounts/{id}/deactivate(id=${account.id})}" method="post">
									<button type="submit" class="btn btn-danger">Dezaktywuj</button>
								</form>
								<form th:unless="${account.active}" th:action="@{/manager/accounts/{id}/reactivate(id=${account.id})}" method="post">
									<button type="submit" class="btn btn-secondary">Reaktywuj</button>
								</form>
								<form th:action="@{/manager/accounts/{id}/role(id=${account.id})}" method="post">
									<input type="hidden" name="role" th:value="${account.role.name() == 'MANAGER'} ? 'TECHNICIAN' : 'MANAGER'">
									<button type="submit" class="btn btn-secondary" th:text="${account.role.name() == 'MANAGER'} ? 'Zmień na technika' : 'Zmień na kierownika'">Zmień rolę</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
