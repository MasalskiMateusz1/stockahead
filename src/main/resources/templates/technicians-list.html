<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Konta techników — Stockahead</title>
</head>
<body>
	<h1>Konta techników</h1>
	<p><a th:href="@{/}">Powrót do pulpitu</a></p>
	<p><a th:href="@{/manager/technicians/new}">Załóż konto technika</a></p>
	<table>
		<thead>
			<tr><th>E-mail</th><th>Status</th><th>Akcja</th></tr>
		</thead>
		<tbody>
			<tr th:each="technician : ${technicians}">
				<td th:text="${technician.email}"></td>
				<td th:text="${technician.active} ? 'Aktywny' : 'Nieaktywny'"></td>
				<td>
					<form th:if="${technician.active}" th:action="@{/manager/technicians/{id}/deactivate(id=${technician.id})}" method="post">
						<button type="submit">Dezaktywuj</button>
					</form>
					<form th:unless="${technician.active}" th:action="@{/manager/technicians/{id}/reactivate(id=${technician.id})}" method="post">
						<button type="submit">Reaktywuj</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
