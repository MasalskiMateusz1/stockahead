<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Pulpit')}">
	<meta charset="UTF-8">
	<title>Pulpit — Stockahead</title>
</head>
<body data-section="dashboard">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Pulpit</h1>

		<div class="kpis">
			<a th:if="${pendingConfirmationCount != null}" th:href="@{/orders}" class="kpi"
					th:classappend="${pendingConfirmationCount > 0} ? 'kpi-warning'">
				<span class="kpi-label">Do potwierdzenia</span>
				<span class="kpi-value" th:text="${pendingConfirmationCount}">0</span>
				<span class="kpi-icon"><svg th:replace="~{fragments :: icon('orders')}"></svg></span>
			</a>
			<a th:if="${openOrderCount != null}" th:href="@{/orders}" class="kpi">
				<span class="kpi-label">Otwarte zlecenia</span>
				<span class="kpi-value" th:text="${openOrderCount}">0</span>
				<span class="kpi-icon"><svg th:replace="~{fragments :: icon('orders')}"></svg></span>
			</a>
			<a th:if="${shortagePartCount != null}" th:href="@{/purchasing}" class="kpi"
					th:classappend="${shortagePartCount > 0} ? 'kpi-warning'">
				<span class="kpi-label">Braki do zakupu</span>
				<span class="kpi-value" th:text="${shortagePartCount}">0</span>
				<span class="kpi-icon"><svg th:replace="~{fragments :: icon('purchasing')}"></svg></span>
			</a>
			<a th:if="${myPickingCount != null}" th:href="@{/picking}" class="kpi">
				<span class="kpi-label">Moje zlecenia do kompletacji</span>
				<span class="kpi-value" th:text="${myPickingCount}">0</span>
				<span class="kpi-icon"><svg th:replace="~{fragments :: icon('picking')}"></svg></span>
			</a>
		</div>

		<div class="tiles">
			<a th:href="@{/parts}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('parts')}"></svg></span>
				<span>Kartoteka części</span>
			</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/parts/import}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('import')}"></svg></span>
				<span>Importuj części z CSV</span>
			</a>
			<a th:href="@{/deliveries/new}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('deliveries')}"></svg></span>
				<span>Przyjmij dostawę</span>
			</a>
			<a th:href="@{/projects}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('projects')}"></svg></span>
				<span>Projekty</span>
			</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/orders}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('orders')}"></svg></span>
				<span>Zlecenia</span>
			</a>
			<a th:href="@{/picking}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('picking')}"></svg></span>
				<span>Lista kompletacyjna</span>
			</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/purchasing}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('purchasing')}"></svg></span>
				<span>Lista zakupów</span>
			</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/manager/accounts}">
				<span class="tile-icon"><svg th:replace="~{fragments :: icon('accounts')}"></svg></span>
				<span>Konta</span>
			</a>
		</div>
	</main>
</body>
</html>
