<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Firmy')}">
	<meta charset="UTF-8">
	<title>Firmy — Stockahead</title>
</head>
<body>
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<h1>Firmy</h1>

		<p th:if="${#lists.isEmpty(companies)}" class="empty">Brak zarejestrowanych firm.</p>

		<div class="table-wrap" th:unless="${#lists.isEmpty(companies)}">
			<table>
				<thead>
					<tr><th>Nazwa</th><th>E-mail kierownika</th><th>Data rejestracji</th><th>Status</th></tr>
				</thead>
				<tbody>
					<tr th:each="company : ${companies}">
						<td th:text="${company.name}"></td>
						<td th:text="${company.managerEmail}"></td>
						<td th:text="${company.registeredOn()}"></td>
						<td th:switch="${company.status.name()}">
							<span th:case="'PENDING'" class="badge badge-info">Oczekuje</span>
							<span th:case="'ACTIVE'" class="badge">Aktywna</span>
							<span th:case="'REJECTED'" class="badge badge-muted">Odrzucona</span>
							<span th:case="'BLOCKED'" class="badge badge-muted">Zablokowana</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
