<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Korekta stanu')}">
	<meta charset="UTF-8">
	<title>Korekta stanu — Stockahead</title>
</head>
<body data-section="parts">
	<header th:replace="~{fragments :: topbar}"></header>

	<main class="container">
		<div class="page-header">
			<h1>Korekta stanu: <span th:text="${partName}"></span> <span th:unless="${partActive}" class="badge badge-muted">(nieaktywna)</span></h1>
			<div class="page-actions">
				<a class="btn btn-secondary" th:href="@{/parts}">Powrót do kartoteki części</a>
			</div>
		</div>

		<p id="summary" class="summary">
			Stan: <strong th:text="${quantity}"></strong>,
			zarezerwowane: <strong th:text="${reserved}"></strong>,
			dostępne: <strong th:text="${available}"></strong>
		</p>

		<div th:replace="~{fragments :: alerts}"></div>

		<div class="panel-stack" th:each="shelf : ${locations}">
			<h2 th:text="'Lokalizacja ' + ${shelf.location} + ' — stan ' + ${shelf.quantity}"></h2>
			<h3>Ustaw stan po spisie</h3>
			<form class="card form-row panel-fit" th:action="@{/parts/{id}/correction/set(id=${partId})}" method="post">
				<input type="hidden" name="locationId" th:value="${shelf.id}">
				<input type="hidden" name="expectedQuantity" th:value="${shelf.quantity}">
				<div class="form-field">
					<label th:for="'newQuantity-' + ${shelf.id}">Nowy stan</label>
					<input type="number" min="0" size="8" th:id="'newQuantity-' + ${shelf.id}" name="newQuantity" th:value="${newQuantity}">
				</div>
				<div class="form-field">
					<label th:for="'setReason-' + ${shelf.id}">Powód</label>
					<input type="text" size="40" maxlength="500" th:id="'setReason-' + ${shelf.id}" name="reason" th:value="${setReason}">
				</div>
				<button type="submit" class="btn">Ustaw stan</button>
			</form>

			<h3>Zmień stan o</h3>
			<form class="card form-row panel-fit" th:action="@{/parts/{id}/correction/adjust(id=${partId})}" method="post">
				<input type="hidden" name="locationId" th:value="${shelf.id}">
				<div class="form-field">
					<label th:for="'delta-' + ${shelf.id}">Zmiana (np. -3 lub 5)</label>
					<input type="number" size="8" th:id="'delta-' + ${shelf.id}" name="delta" th:value="${delta}">
				</div>
				<div class="form-field">
					<label th:for="'adjustReason-' + ${shelf.id}">Powód</label>
					<input type="text" size="40" maxlength="500" th:id="'adjustReason-' + ${shelf.id}" name="reason" th:value="${adjustReason}">
				</div>
				<button type="submit" class="btn">Zmień stan</button>
			</form>

		</div>
		<div class="panel-stack">
			<h2>Poprzednie korekty</h2>
			<div class="list-panel panel-fit">
				<p th:if="${#lists.isEmpty(corrections)}" class="empty">Brak korekt</p>
				<div class="table-wrap" th:unless="${#lists.isEmpty(corrections)}">
					<table>
						<thead>
							<tr>
								<th>Data</th>
								<th>Autor</th>
								<th>Lokalizacja</th>
								<th>Przed → Po</th>
								<th>Zmiana</th>
								<th>Powód</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="correction : ${corrections}">
								<td th:text="${@orderMoments.format(correction.createdAt)}"></td>
								<td th:text="${correction.account.email}"></td>
								<td th:text="${correction.locationName}"></td>
								<td th:text="${correction.quantityBefore} + ' → ' + ${correction.quantityAfter}"></td>
								<td th:text="${correction.delta > 0} ? '+' + ${correction.delta} : ${correction.delta}"></td>
								<td th:text="${correction.reason}"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
