<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' — Stockahead'">Stockahead</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/theme.js}"></script>
</head>
<body>

	<header class="topbar" th:fragment="topbar">
		<a class="brand" th:href="@{/}">Stockahead</a>
		<nav aria-label="Nawigacja główna">
			<a th:href="@{/parts}">Kartoteka części</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/parts/import}">Importuj części z CSV</a>
			<a th:href="@{/deliveries/new}">Przyjmij dostawę</a>
			<a th:href="@{/projects}">Projekty</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/orders}">Zlecenia</a>
			<a th:href="@{/picking}">Lista kompletacyjna</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/purchasing}">Lista zakupów</a>
			<a sec:authorize="hasRole('MANAGER')" th:href="@{/manager/technicians}">Konta techników</a>
		</nav>
		<div class="session">
			<span sec:authentication="name"></span>
			<span class="badge badge-muted" sec:authorize="hasRole('MANAGER')">Kierownik</span>
			<span class="badge badge-muted" sec:authorize="!hasRole('MANAGER')">Technik</span>
			<button type="button" class="btn btn-secondary btn-icon" data-theme-toggle data-mode="auto" aria-label="Motyw: Auto" title="Motyw: Auto" hidden>
				<svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
				<svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
				<svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
			</button>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-secondary">Wyloguj</button>
			</form>
		</div>
	</header>

	<div th:fragment="alerts" th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>

	<!-- Section icons (Lucide outlines, ISC licence), one per area; used by the dashboard tiles. -->
	<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" aria-hidden="true" th:switch="${name}">
		<g th:case="'parts'"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></g>
		<g th:case="'import'"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></g>
		<g th:case="'deliveries'"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></g>
		<g th:case="'projects'"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g>
		<g th:case="'orders'"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1M12 18h1M7 18h1"/></g>
		<g th:case="'picking'"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></g>
		<g th:case="'purchasing'"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></g>
		<g th:case="'technicians'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
		<g th:case="'access'"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
	</svg>

</body>
</html>
