<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rejestracja firmy')}">
	<meta charset="UTF-8">
	<title>Rejestracja firmy — Stockahead</title>
</head>
<body>
	<main class="auth-page">
		<div class="auth-brand">Stockahead</div>
		<div class="card">
			<h1>Zarejestruj firmę</h1>

			<div th:replace="~{fragments :: alerts}"></div>

			<form class="form-grid" th:action="@{/register}" method="post">
				<div class="form-field">
					<label for="companyName">Nazwa firmy</label>
					<input type="text" id="companyName" name="companyName" th:value="${companyName}" maxlength="255" required>
				</div>
				<div class="form-field">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" th:value="${email}" maxlength="255" required>
				</div>
				<div class="form-field">
					<label for="password">Hasło</label>
					<input type="password" id="password" name="password" minlength="12" required>
				</div>
				<div class="form-field">
					<label for="confirmPassword">Potwierdź hasło</label>
					<input type="password" id="confirmPassword" name="confirmPassword" minlength="12" required>
				</div>
				<div class="form-field form-trap" aria-hidden="true">
					<label for="hp_7c1f">Pozostaw to pole puste</label>
					<input type="text" id="hp_7c1f" name="hp_7c1f" tabindex="-1" autocomplete="off" aria-hidden="true">
				</div>
				<button type="submit" class="btn">Zarejestruj firmę</button>
			</form>

			<p class="hint">Masz już konto? <a th:href="@{/login}">Zaloguj się</a></p>
		</div>
	</main>
</body>
</html>
