name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy, e.g. sha-1234abc (rollback). Leave empty to only build this ref.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # a tag dispatch deploys an image CI already tested, so it skips straight to deploy
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Testcontainers Postgres 18)
        run: ./mvnw -B verify

  image:
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: tag
        name: Record tag
        run: |
          tag="sha-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # after image on pushes to main (D5), or on demand with a tag to roll back
    needs: image
    if: >-
      !cancelled()
      && ((github.event_name == 'push' && needs.image.result == 'success')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
      TAG: ${{ github.event.inputs.tag || needs.image.outputs.tag }}
    steps:
      - name: Check the tag and the credentials (runbook 7.2)
        run: |
          set -euo pipefail
          for v in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET APP_HEALTH_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is missing; add it at repository level (runbook 7.2)"
              exit 1
            fi
          done
          # the tag ends up in a URL and a JSON body, so accept only what CI produces
          if ! [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::tag '$TAG' is not sha-<7 hex digits>"
            exit 1
          fi
          echo "Deploying $TAG to $COOLIFY_URL"
      - name: Deploy, verify it is serving, roll back if it is not
        run: |
          set -euo pipefail

          # api METHOD PATH [JSON-BODY] -> response body on stdout; anything but 2xx fails the call.
          # Access sits in front of Coolify, so a missing service token shows up as a 302, not an error,
          # and a Cloudflare bot challenge as a 403 HTML page. Both need the body to diagnose.
          # GET and PATCH retry: the edge resets a connection now and then (seen 2026-09-21).
          # POST never retries - a lost response would queue the deployment twice.
          api() {
            local method=$1 path=$2 body=${3:-} code
            local -a args=(
              -sS --max-time 60 -o /tmp/api.json -D /tmp/api.hdr -w '%{http_code}'
              -X "$method" "$COOLIFY_URL$path"
              -H "Authorization: Bearer $COOLIFY_TOKEN"
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
              -H 'Accept: application/json'
            )
            if [ "$method" != POST ]; then
              args+=(--retry 3 --retry-all-errors --retry-delay 5)
            fi
            if [ -n "$body" ]; then
              args+=(-H 'Content-Type: application/json' --data "$body")
            fi
            code=$(curl "${args[@]}")
            case "$code" in
              2??) cat /tmp/api.json ;;
              *)
                echo "::error::$method $path returned HTTP $code" >&2
                head -c 800 /tmp/api.json >&2
                echo >&2
                grep -iE '^(cf-ray|cf-mitigated|cf-cache-status|server):' /tmp/api.hdr >&2 || true
                return 1
                ;;
            esac
          }

          # deploy_tag TAG: store the tag (write), start a deployment (deploy), wait for it (read).
          # Coolify reports "finished" once the container is created, NOT once it is healthy, so a
          # green result here proves nothing about the app. That is what serving() is for.
          deploy_tag() {
            local tag=$1 dep status deadline
            api PATCH "/api/v1/applications/$COOLIFY_APP_UUID" \
              "$(jq -nc --arg t "$tag" '{docker_registry_image_tag: $t}')" > /dev/null
            echo "  stored tag is now $tag"
            dep=$(api POST "/api/v1/deploy?uuid=$COOLIFY_APP_UUID" \
              | jq -r '.deployments[0].deployment_uuid // empty')
            if [ -z "$dep" ]; then
              echo "::error::the deploy call returned no deployment_uuid"
              return 1
            fi
            echo "  deployment $dep queued"
            status=''
            deadline=$(( SECONDS + 20 * 60 ))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! api GET "/api/v1/deployments/$dep" > /tmp/deployment.json; then
                echo "  (could not read the status; the deployment is still running)"
                sleep 10
                continue
              fi
              status=$(jq -r '.status // empty' /tmp/deployment.json)
              case "$status" in
                finished) return 0 ;;
                failed|cancelled-by-user)
                  echo "::group::Coolify deployment log"
                  jq -r '.logs // "(no logs)"' /tmp/deployment.json \
                    | jq -r 'if type == "array" then .[].output else . end' 2>/dev/null \
                    | tail -n 120 || true
                  echo "::endgroup::"
                  echo "::error::deployment $dep $status"
                  return 1
                  ;;
                *) echo "  $status"; sleep 10 ;;
              esac
            done
            echo "::error::gave up after 20 min (last status: ${status:-unknown})"
            return 1
          }

          # serving: the only check that means anything - can the outside world use the app?
          # The window has to outlast a legitimate start (JVM plus Flyway, and a normal rollout
          # also serves 404 for a few seconds while Traefik has no backend), but every second of it
          # is downtime when the image is broken: the 7.4 re-run sat at 404 for 3 m 26 s, of which
          # 3 minutes was this timer. 120 s is roughly four times the observed healthy start.
          serving() {
            local deadline=$(( SECONDS + 120 )) code
            while [ "$SECONDS" -lt "$deadline" ]; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$APP_HEALTH_URL" || echo 000)
              if [ "$code" = 200 ]; then
                echo "  $APP_HEALTH_URL -> 200"
                return 0
              fi
              echo "  $APP_HEALTH_URL -> $code"
              sleep 5
            done
            return 1
          }

          # Captured before anything changes: Coolify's stored tag is the only record of what was
          # meant to be running, and it is what gets restored if the new image does not come up.
          previous=$(api GET "/api/v1/applications/$COOLIFY_APP_UUID" \
            | jq -r '.docker_registry_image_tag // empty')
          echo "currently configured: ${previous:-none}"

          ok=0
          deploy_tag "$TAG" && serving && ok=1

          if [ "$ok" = 1 ]; then
            echo "Deployed $TAG and verified it is serving" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Coolify swaps containers without waiting for health - the 7.4 drill put a broken image
          # live and took the site down for 65 s while the deployment reported "finished" - so
          # getting back to the last known-good tag is this job's responsibility, not Coolify's.
          echo "::error::$TAG is not serving"
          if [ -z "$previous" ] || [ "$previous" = "$TAG" ]; then
            echo "::error::no earlier tag to fall back to; the site needs manual attention"
            exit 1
          fi
          echo "rolling back to $previous"
          if deploy_tag "$previous" && serving; then
            echo "::warning::$TAG failed to serve; rolled back to $previous"
            echo "Rolled back to $previous after $TAG failed to serve" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the rollback to $previous did not come up either; the site is down"
            echo "Rollback to $previous FAILED - the site is down" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
